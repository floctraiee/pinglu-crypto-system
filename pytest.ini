[pytest]
# 只收集 tests/ 下的文件。仓库根目录可能出现权限异常的 pytest-cache-files-* 目录，
# pytest 默认会扫描根目录并尝试收集它，导致 PermissionError 中断整个会话。
testpaths = tests

norecursedirs =
    .git
    .venv
    __pycache__
    anomaly_cases
    _anomaly_scratch
    pytest-cache-files-*
    preview-manual

# 关闭缓存插件：某些受限环境下 .pytest_cache 无法创建，会刷一堆 PytestCacheWarning
addopts = -p no:cacheprovider